<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Saya</title>
</head>
<body>
    <h1>Halo dari GitHub Pages!</h1>
    <button id="tombolData">Ambil Data dari Apps Script</button>
    <p id="hasil"></p>

    <script>
        // Ganti teks di bawah dengan Web App URL milik Anda
        const urlAppsScript = "https://script.google.com/macros/s/AKfycbyA-tF7J3RJrlyn7GMVLBvOLSX7fK9eqzq-n7C2Jghb-4_8Aj45WvWi6UpwNDlijwSSRw/exec";

        document.getElementById('tombolData').addEventListener('click', () => {
            // Kita gunakan innerHTML agar bisa memuat elemen HTML
            document.getElementById('hasil').innerHTML = "<i>Menunggu data dari Google Sheets...</i>";

            fetch(urlAppsScript)
                .then(response => response.json())
                .then(data => {
                    // Membuat kerangka tabel HTML
                    let tabelHTML = "<table border='1' style='border-collapse: collapse; margin-top: 15px;'>";
                    
                    // Membaca setiap baris data dari Google Sheets
                    data.forEach((baris, index) => {
                        tabelHTML += "<tr>";
                        // Membaca setiap sel di dalam baris tersebut
                        baris.forEach(sel => {
                            if (index === 0) {
                                // Baris pertama dijadikan tajuk tebal (header)
                                tabelHTML += "<th style='padding: 8px; background-color: #f2f2f2;'>" + sel + "</th>";
                            } else {
                                // Baris selanjutnya adalah data biasa
                                tabelHTML += "<td style='padding: 8px;'>" + sel + "</td>";
                            }
                        });
                        tabelHTML += "</tr>";
                    });
                    tabelHTML += "</table>";

                    // Menampilkan tabel utuh ke layar
                    document.getElementById('hasil').innerHTML = tabelHTML;
                })
                .catch(error => {
                    document.getElementById('hasil').innerHTML = "<b>Gagal mengambil data.</b>";
                    console.error(error);
                });
        });
    </script>
</body>
</html>
