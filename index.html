<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Saya</title>
</head>
<body>
    <h1>Halo dari GitHub Pages!</h1>
    <button id="tombolData">Ambil Data dari Apps Script</button>
    <p id="hasil"></p>

    <script>
        // Ganti teks di bawah dengan Web App URL milik Anda
        const urlAppsScript = "https://script.google.com/macros/s/AKfycbyA-tF7J3RJrlyn7GMVLBvOLSX7fK9eqzq-n7C2Jghb-4_8Aj45WvWi6UpwNDlijwSSRw/exec";

        document.getElementById('tombolData').addEventListener('click', () => {
            document.getElementById('hasil').innerText = "Menunggu data...";

            // Menggunakan fetch untuk memanggil URL Apps Script
            fetch(urlAppsScript)
                .then(response => response.json()) // Mengubah respons menjadi JSON
                .then(data => {
                    // Menampilkan data di HTML
                    document.getElementById('hasil').innerText = data.pesan;
                })
                .catch(error => {
                    document.getElementById('hasil').innerText = "Gagal mengambil data.";
                    console.error(error);
                });
        });
    </script>
</body>
</html>
